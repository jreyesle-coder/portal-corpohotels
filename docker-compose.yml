# Entorno local con paridad Azure (ver docs/requerimientos.md, "Paridad entre local y Azure").
#   docker compose up --build            → todo, incluido el portal en http://localhost:3000
#   docker compose up -d postgres azurite mailpit matomo entra-simulado   → solo servicios, para `npm run dev`
# El contenedor "portal" corre como el portal público de producción (PANEL_HABILITADO=0): sin panel
# del CMS ni inicio de sesión. El panel se usa con `npm run dev`, igual que la app privada en Azure.
# Credenciales solo de desarrollo; no reutilizar en ningún otro entorno.

name: portal-corphotels

services:
  portal:
    build: .
    ports:
      - "3000:3000"
    environment:
      SITE_URL: http://localhost:3000
      DATABASE_URL: postgres://portal:portal_dev@postgres:5432/portal
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      AZURE_STORAGE_CONTAINER: medios
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-responder@corphotels.gob.do
      # El portal reenvía las estadísticas a Matomo por la red interna (el navegador no lo contacta).
      MATOMO_URL: http://matomo
      MATOMO_SITE_ID: "1"
      AZURE_STORAGE_BASE_URL: http://localhost:10000/devstoreaccount1
      PAYLOAD_SECRET: clave-de-desarrollo-solo-para-docker-compose-local
      PANEL_HABILITADO: "0"
      OIDC_ISSUER: http://entra-simulado:8080/entra
      OIDC_CLIENT_ID: cms-corphotels-local
      OIDC_CLIENT_SECRET: simulado
      # Misma clave que `npm run dev` (archivo .env): ambos comparten la base de datos local.
      CLAVE_CIFRADO_DATOS: ${CLAVE_CIFRADO_DATOS:?Defina CLAVE_CIFRADO_DATOS en el archivo .env}
      CORREO_ATENCION: info@corphotels.gob.do
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
      mailpit:
        condition: service_started

  # Azure Database for PostgreSQL Flexible Server: misma versión mayor (novedad N-02).
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Azure Blob Storage.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # --skipApiVersionCheck: el SDK de Azure suele usar una versión de API más nueva que Azurite.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite:/data

  # Azure Communication Services (Email): bandeja en http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Simulador de Entra ID (OpenID Connect) para desarrollo y pruebas: formulario donde se indican
  # usuario, roles y métodos de autenticación (amr). En Azure se usa Entra ID corporativo.
  entra-simulado:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'

  # Matomo autohospedado (A2 5.04.3): asistente en http://localhost:8080.
  # Matomo requiere MySQL/MariaDB, no PostgreSQL (novedad N-03).
  matomo:
    image: matomo:5-apache
    ports:
      - "8080:80"
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo_dev
      MATOMO_DATABASE_DBNAME: matomo
    volumes:
      - matomo:/var/www/html
    depends_on:
      matomo-db:
        condition: service_healthy

  matomo-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: matomo_dev
      MARIADB_ROOT_PASSWORD: matomo_root_dev
    volumes:
      - matomo-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  azurite:
  matomo:
  matomo-db:
